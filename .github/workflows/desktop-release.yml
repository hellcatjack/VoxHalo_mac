name: Standalone Mac release
on:
  push:
    branches: ['release/**']
    tags: ['v1.8.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build portable runtime, App, ZIP and DMG
        id: package
        shell: bash
        env:
          VOXHALO_CI_ALLOW_NO_METAL: '1'
          UV_HTTP_CONNECT_TIMEOUT: '30'
          UV_HTTP_TIMEOUT: '120'
          UV_HTTP_RETRIES: '5'
        run: |
          set -o pipefail
          ./scripts/bootstrap_release.sh 2>&1 | tee desktop-build.log
      - name: Report build failure
        if: failure() && steps.package.outcome == 'failure'
        shell: python3 {0}
        run: |
          from pathlib import Path
          log = Path('desktop-build.log')
          detail = '\n'.join(log.read_text(errors='replace').splitlines()[-70:])[-20000:] if log.exists() else 'Build did not create a log.'
          for offset in range(0, len(detail), 3000):
              part = detail[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Desktop build diagnostic {offset // 3000 + 1}::{part}')
      - name: Verify release contracts
        shell: bash
        run: |
          export UV_PYTHON_INSTALL_DIR="$PWD/runtime/release-tools/python"
          runtime/release-tools/uv venv --managed-python --python 3.12.14 .venv
          runtime/release-tools/uv pip install --python .venv/bin/python pytest==8.4.2
          cd VoxBridge
          ../.venv/bin/python -m pytest tests/test_desktop_bundle.py tests/test_desktop_packaging.py tests/test_desktop_installer.py tests/test_desktop_native.py -q
      - name: Save installable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxhalo-desktop
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: voxhalo-desktop
          path: release-assets
      - name: Verify files and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "VoxHalo ${RELEASE_TAG#v} · 同声传译" \
            --notes-file docs/releases/1.8.0.md
