name: Read failed desktop build
on:
  push:
    branches: ['release/1.8.0']
    paths: ['.github/workflows/release-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Read previous build output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/104420121121/logs" > prior-build.log 2>&1 || true
      - name: Show failure tail
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re
          detail = '\n'.join(Path('prior-build.log').read_text(errors='replace').splitlines()[-45:])[-18000:]
          detail = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', detail)
          for offset in range(0, len(detail), 2800):
              part = detail[offset:offset + 2800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Previous build {offset // 2800 + 1}::{part}')
