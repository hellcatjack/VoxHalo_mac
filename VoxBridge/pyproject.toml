[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxbridge"
version = "0.2.0"
description = "Real-time speech recognition and bilingual subtitle streaming service"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "hellcatjack", email = "hellcatjack@gmail.com" }]
license = { text = "Apache-2.0" }
dependencies = [
  "qwen-asr[vllm]==0.0.6; sys_platform != 'darwin'",
  "fastapi==0.129.0",
  "uvicorn==0.41.0",
  "numpy",
  "websockets",
  "qrcode==8.2",
]

[project.optional-dependencies]
asr-zipformer = [
  "sherpa-onnx==1.12.40",
  "sherpa-onnx-core==1.12.40",
]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.3.0",
]
macos = [
  "mlx==0.32.2; sys_platform == 'darwin'",
  "mlx-metal==0.32.2; sys_platform == 'darwin'",
  "mlx-qwen3-asr==0.4.0; sys_platform == 'darwin'",
  "imageio-ffmpeg==0.6.0",
  "espeakng-loader==0.2.4",
  "onnxruntime==1.30.0",
]
tts = [
  "kokoro-onnx==0.5.0",
  "misaki[zh]==0.9.4",
  "jieba==0.42.1",
  "soundfile>=0.13.1",
]
vad-shadow = [
  "silero-vad==6.2.1",
]

[project.scripts]
voxbridge-streaming-ws = "voxbridge.cli.demo_streaming_ws:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["voxbridge*"] } }
include-package-data = true

[tool.setuptools.package-data]
"voxbridge.tts" = ["vendor/*.js", "vendor/*.txt"]
