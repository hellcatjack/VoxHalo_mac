# Local assets only; shadow adds diagnostics without changing subtitle decisions.
# Install as voxbridge-8024.service.d/60-qwen-local.conf.
[Service]
Environment="VOXBRIDGE_QWEN_SUBMISSION_MODE=shadow"
Environment="HF_HUB_OFFLINE=1"
Environment="TRANSFORMERS_OFFLINE=1"
Environment="HF_HUB_DISABLE_TELEMETRY=1"
Environment="VLLM_NO_USAGE_STATS=1"
Environment="DO_NOT_TRACK=1"
